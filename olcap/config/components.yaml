# =============================================================================
# COMPONENT CATALOG - every implementation the system may use.
#
# provenance_verified is intentionally null until `olcap-verify-provenance` runs
# and checks the repository / license / maintenance against the GitHub API.
# Nothing here is assumed to be true; it is all CHECKED.
#
# paid: true  =>  may require a paid account to operate. Such components can
#                 never become mandatory (they are always `optional: true` and
#                 always have a free fallback).
# =============================================================================

components:

  # ---------------------------------------------------------------- SEARCH ---
  - id: olcap-search-core
    name: OLCAP Multi-Engine Search
    category: search
    capabilities: [WEB_SEARCH]
    provides: [WEB_SEARCH, SOURCE_DISCOVERY, SOURCE_COMPARISON]
    repository: ""
    documentation: "docs/TOOLS.md#olcap-search-core"
    owner: olcap
    license: Apache-2.0
    version: "1.0"
    maintenance: local
    integration: builtin
    install_method: builtin
    platforms: [windows, linux]
    api_requirements: []
    paid: false
    self_hosted: true
    jit: false
    resource_mb: 32
    permissions: [network]
    notes: >-
      Federated search over DuckDuckGo HTML, Wikipedia/Wikidata API, optional
      HackerNews (Algolia) and any SearXNG instance. No API key, no cost.

  - id: searxng
    name: SearXNG (self-hosted metasearch)
    category: search
    capabilities: [WEB_SEARCH]
    provides: [WEB_SEARCH]
    repository: https://github.com/searxng/searxng
    documentation: https://docs.searxng.org/
    owner: searxng
    license: AGPL-3.0
    integration: service
    install_method: docker
    install_target: searxng/searxng:latest
    healthcheck: "http://{host}/healthz"
    platforms: [windows, linux]
    runtimes: [docker]
    paid: false
    self_hosted: true
    jit: true
    resource_mb: 512
    permissions: [network]
    optional: true
    fallback_for: [olcap-search-core]

