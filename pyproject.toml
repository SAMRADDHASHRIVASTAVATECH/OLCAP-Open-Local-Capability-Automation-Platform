[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "olcap"
version = "0.1.0"
description = "Open Local Capability & Automation Platform — a local MCP capability and automation layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "SAMRADDHASHRIVASTAVATECH"}
]
keywords = [
    "ai",
    "agents",
    "mcp",
    "automation",
    "opencode",
    "openlive",
    "rag",
    "local-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "mcp"
]

[project.urls]
Homepage = "https://github.com/SAMRADDHASHRIVASTAVATECH/OLCAP-Open-Local-Capability-Automation-Platform"
Repository = "https://github.com/SAMRADDHASHRIVASTAVATECH/OLCAP-Open-Local-Capability-Automation-Platform"
Issues = "https://github.com/SAMRADDHASHRIVASTAVATECH/OLCAP-Open-Local-Capability-Automation-Platform/issues"

[project.scripts]
olcap = "olcap.__main__:main"

[tool.setuptools.packages.find]
include = ["olcap*"]
